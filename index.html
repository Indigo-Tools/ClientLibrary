<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Library Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1e2124;
            color: #cccccf;
        }
        .glass-card {
            background: #39393e;
            border: 1px solid #808080;
        }
        .tab-active {
            border-bottom: 2px solid #347ccb;
            color: #ffffff;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e2124;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #808080;
            border-radius: 10px;
        }
        .btn-primary {
            background-color: #347ccb;
        }
        .btn-primary:hover {
            background-color: #2b66a8;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white mb-4 tracking-tight">Client Library</h1>
            <p class="text-[#808080]">Select a version to browse available client builds.</p>
        </header>

        <div id="status-container" class="flex flex-col items-center justify-center space-y-4 py-20">
            <div id="loader" class="w-10 h-10 border-3 border-[#347ccb] border-t-transparent rounded-full animate-spin"></div>
            <p id="status-text" class="text-[#808080] text-sm font-medium">Synchronizing with Indigo-Tools...</p>
        </div>

        <div id="main-content" class="hidden">
            <div class="flex items-center justify-between mb-6 border-b border-[#808080] overflow-x-auto custom-scrollbar">
                <nav id="version-tabs" class="flex space-x-8 whitespace-nowrap">
                </nav>
            </div>

            <div class="mb-6">
                <input type="text" id="search-input" placeholder="Filter assets..." 
                       class="w-full bg-[#1e2124] border border-[#808080] rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#347ccb] text-[#cccccf]">
            </div>

            <div id="asset-list" class="space-y-3">
            </div>
        </div>
    </div>

    <script>
        const GITHUB_ORG = 'Indigo-Tools'; 
        const REPO_NAME = 'ClientLibrary';
        const ROOT_PATH = 'ClientLibrary';
        const BRANCH = 'main';
        
        const GITHUB_TOKEN = typeof __github_token !== 'undefined' ? __github_token : ''; 

        const ALLOWED_EXTENSIONS = ['.zip', '.dll', '.so', '.apk', '.mcpack', '.mcaddon'];

        let archiveData = [];
        let currentSelection = null;

        async function fetchWithRetry(path, retries = 5, delay = 1000) {
            const url = `https://api.github.com/repos/${GITHUB_ORG}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (GITHUB_TOKEN) headers['Authorization'] = `token ${GITHUB_TOKEN}`;

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, { headers });
                    if (response.ok) return await response.json();
                    if (response.status !== 403 && response.status !== 429 && response.status !== 500) throw new Error();
                } catch (err) {
                    if (i === retries - 1) throw err;
                }
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
        }

        function formatDisplayName(name) {
            return name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        }

        function isFileAllowed(fileName) {
            const name = fileName.toLowerCase();
            if (name.endsWith('.md')) return false;
            return ALLOWED_EXTENSIONS.some(ext => name.endsWith(ext));
        }

        async function init() {
            if (!GITHUB_TOKEN) {
                document.getElementById('status-container').innerHTML = `
                    <div class="bg-red-500/10 text-red-500 p-4 rounded-lg border border-red-500/20 max-w-md text-center">
                        <p class="font-bold mb-1">Missing Environment Variable</p>
                        <p class="text-sm">Please set the __github_token environment variable to access the private repository.</p>
                    </div>
                `;
                return;
            }

            try {
                const contents = await fetchWithRetry(ROOT_PATH);
                archiveData = await Promise.all(contents.filter(f => f.type === 'dir').map(async (folder) => {
                    const files = await fetchWithRetry(folder.path);
                    return {
                        id: folder.name,
                        label: folder.name.replace('_', '.'),
                        files: files.filter(file => file.type === 'file' && isFileAllowed(file.name))
                    };
                }));

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                renderTabs();
                switchVersion('all');

            } catch (err) {
                document.getElementById('status-container').innerHTML = `<p class="text-red-500">Failed to load repository. Check token permissions.</p>`;
            }
        }

        function renderTabs() {
            const container = document.getElementById('version-tabs');
            let tabsHtml = `
                <button onclick="switchVersion('all')" id="tab-all" 
                        class="pb-3 text-sm font-medium text-[#808080] hover:text-[#cccccf] transition-colors">
                    All Files
                </button>
            `;
            
            tabsHtml += archiveData.map(v => `
                <button onclick="switchVersion('${v.id}')" id="tab-${v.id}" 
                        class="pb-3 text-sm font-medium text-[#808080] hover:text-[#cccccf] transition-colors">
                    Version ${v.label}
                </button>
            `).join('');
            
            container.innerHTML = tabsHtml;
        }

        function switchVersion(id) {
            if (id === 'all') {
                const allFiles = archiveData.flatMap(v => v.files.map(f => ({ ...f, versionLabel: v.label })));
                currentSelection = { id: 'all', files: allFiles };
            } else {
                currentSelection = archiveData.find(v => v.id === id);
            }

            document.querySelectorAll('#version-tabs button').forEach(btn => btn.classList.remove('tab-active', 'text-white'));
            const activeTab = document.getElementById(`tab-${id}`);
            if (activeTab) activeTab.classList.add('tab-active', 'text-white');
            renderAssets();
        }

        function renderAssets(filter = '') {
            const container = document.getElementById('asset-list');
            const filteredFiles = currentSelection.files.filter(f => 
                f.name.toLowerCase().includes(filter.toLowerCase())
            );

            if (filteredFiles.length === 0) {
                container.innerHTML = `<p class="text-center py-10 text-[#808080] text-sm">No assets found matching your criteria.</p>`;
                return;
            }

            container.innerHTML = filteredFiles.map(file => `
                <div class="glass-card rounded-xl p-4 flex items-center justify-between">
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-[#cccccf]">${formatDisplayName(file.name)}</span>
                        <div class="flex items-center space-x-2 mt-1">
                            <span class="text-[10px] text-[#808080] font-mono uppercase tracking-tighter">${file.name}</span>
                            ${file.versionLabel ? `<span class="bg-[#347ccb]/10 text-[#347ccb] text-[9px] px-1.5 py-0.5 rounded border border-[#347ccb]/20 font-bold uppercase tracking-widest">v${file.versionLabel}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="downloadPrivateFile('${file.url}', '${file.name}')" 
                            class="btn-primary text-white text-xs font-bold py-2 px-6 rounded-lg transition-all active:scale-95 shadow-sm">
                        Download
                    </button>
                </div>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderAssets(e.target.value);
        });

        async function downloadPrivateFile(apiUrl, fileName) {
            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3.raw'
                    }
                });
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {}
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
