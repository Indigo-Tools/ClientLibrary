<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indigo Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --accent: #347ccb; --bg: #0f1113; --card: #16181a; }
        body { background-color: var(--bg); color: #a1a1aa; overflow-x: hidden; }
        
        .glass-card { 
            background: var(--card); 
            border: 1px solid #282a2d; 
            transition: all 0.2s ease;
            position: relative;
            z-index: 20;
            overflow: hidden;
            border-radius: 1rem;
        }

        .banner-card {
            background: none !important;
            border: 1px solid #282a2d;
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
        }

        .banner-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .banner-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(15,17,19,1) 0%, rgba(15,17,19,0.7) 40%, rgba(15,17,19,0.1) 100%);
            z-index: 1;
        }

        .card-content { position: relative; z-index: 10; width: 100%; height: 100%; }
        
        .extension-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            background: #111315;
            border: 1px solid #232528;
            border-top: none;
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
            margin-top: -12px;
            position: relative;
            z-index: 10;
        }

        .extension-dropdown.open {
            max-height: 2000px;
            opacity: 1;
            padding-top: 20px;
            margin-bottom: 20px;
        }

        .extension-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem;
            border-top: 1px solid #1e2022;
            transition: background 0.2s;
        }
        .extension-row:hover { background: #1a1c1e; }

        .tab-active { border-bottom: 3px solid var(--accent); color: #ffffff !important; }

        .btn-download {
            background-color: var(--accent);
            box-shadow: 0 0 15px rgba(52, 124, 203, 0.4);
            white-space: nowrap;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-16">
        <header class="text-center mb-10">
            <div class="inline-block p-4 rounded-2xl bg-[#347ccb]/10 mb-4">
                <i class="fa-solid fa-box-open text-[#347ccb] text-3xl"></i>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black text-white mb-2 tracking-tight">Indigo Library</h1>
            <p class="text-zinc-500 font-bold uppercase text-[10px] tracking-[0.3em]">mca.glacierclient.xyz</p>
        </header>

        <div id="status-container" class="flex flex-col items-center justify-center py-20">
            <div id="loader" class="w-10 h-10 border-4 border-[#347ccb]/20 border-t-[#347ccb] rounded-full animate-spin"></div>
            <p id="status-text" class="mt-4 text-zinc-500 text-sm font-medium">Indexing Library...</p>
        </div>

        <div id="main-content" class="hidden space-y-8">
            <div class="border-b border-zinc-800/50 sticky top-0 bg-[#0f1113]/90 backdrop-blur-md z-30">
                <nav id="category-tabs" class="flex space-x-6 sm:space-x-10 overflow-x-auto no-scrollbar py-2 px-1"></nav>
            </div>

            <div class="relative max-w-2xl mx-auto w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-zinc-600"></i>
                <input type="text" id="search-input" placeholder="Search archive..." 
                       class="w-full bg-[#16181a] border border-zinc-800 rounded-2xl pl-14 pr-6 py-4 text-white focus:outline-none focus:border-[#347ccb]">
            </div>

            <div id="client-container" class="space-y-12 pb-20"></div>
        </div>
    </div>

    <script>
        const GITHUB_ORG = 'Indigo-Tools'; 
        const REPO_NAME = 'ClientLibrary';
        const BRANCH = 'main';
        const BASE_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_ORG}/${REPO_NAME}/${BRANCH}`;
        
        let libraryTree = []; 
        let currentCategory = "ALL";
        const CATEGORY_ORDER = ["ALL", "Popular Clients", "1_20", "1_19", "1_18", "1_17", "1_16"];

        function formatName(name) {
            if (!name) return "";
            return name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        }

        function toggleDropdown(id) {
            const dropdown = document.getElementById('drop-' + id);
            const icon = document.getElementById('icon-' + id);
            dropdown.classList.toggle('open');
            icon.classList.toggle('rotate-180');
        }

        const versionSort = (a, b) => {
            return b.rawName.localeCompare(a.rawName, undefined, { numeric: true, sensitivity: 'base' });
        };

        async function init() {
            try {
                const response = await fetch(`${BASE_RAW_URL}/paths.json?t=${Date.now()}`);
                const rawPaths = await response.json();
                const structured = {};

                rawPaths.forEach(path => {
                    const parts = path.split('/');
                    if (parts.length < 3) return;
                    
                    const category = parts[1];
                    const fileName = parts[parts.length - 1];
                    const extIdx = parts.findIndex(p => p.toLowerCase() === 'extensions');
                    const isExtension = extIdx !== -1;
                    const clientName = parts[2];

                    if (!structured[category]) structured[category] = {};
                    if (!structured[category][clientName]) {
                        structured[category][clientName] = { icon: null, banner: null, files: [], extensions: [] };
                    }

                    const encodedPath = path.split('/').map(p => encodeURIComponent(p)).join('/');
                    const fullUrl = `${BASE_RAW_URL}/${encodedPath}`;

                    if (fileName.toLowerCase() === 'pack_icon.png') structured[category][clientName].icon = fullUrl;
                    else if (fileName.toLowerCase() === 'pack_banner.png') structured[category][clientName].banner = fullUrl;
                    else if (fileName.toLowerCase().match(/\.(zip|dll|so|apk|mcpack|mcaddon)$/)) {
                        const fileObj = { display: formatName(fileName), rawName: fileName, url: fullUrl };
                        if (isExtension) structured[category][clientName].extensions.push(fileObj);
                        else structured[category][clientName].files.push(fileObj);
                    }
                });

                libraryTree = Object.entries(structured)
                    .sort((a, b) => (CATEGORY_ORDER.indexOf(a[0]) || 99) - (CATEGORY_ORDER.indexOf(b[0]) || 99))
                    .map(([catName, clients]) => ({
                        name: catName,
                        displayName: catName.startsWith('1_') ? `Version: ${catName.replace('_', '.')}` : catName,
                        clients: Object.entries(clients).map(([cliName, data]) => ({
                            id: btoa(catName + cliName).replace(/[^a-zA-Z]/g, '').substring(0, 8),
                            displayName: formatName(cliName),
                            iconUrl: data.icon,
                            bannerUrl: data.banner,
                            files: data.files.sort(versionSort),
                            extensions: data.extensions.sort(versionSort),
                            isPopular: catName === "Popular Clients"
                        })).filter(c => c.files.length > 0 || c.extensions.length > 0)
                    })).filter(cat => cat.clients.length > 0);

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                renderTabs();
                switchCategory("ALL");
            } catch (err) { console.error(err); }
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            const tabs = ["ALL", ...libraryTree.map(c => c.name)];
            container.innerHTML = tabs.map(t => {
                const label = t === "ALL" ? "All" : (t.startsWith('1_') ? `Version: ${t.replace('_', '.')}` : t);
                return `<button onclick="switchCategory('${t}')" id="tab-${t}" class="pb-3 text-xs font-bold text-zinc-500 hover:text-white uppercase tracking-widest transition-colors">${label}</button>`;
            }).join('');
        }

        function switchCategory(name) {
            currentCategory = name;
            document.querySelectorAll('#category-tabs button').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`tab-${name}`).classList.add('tab-active');
            renderClients();
        }

        function renderClients(query = '') {
            const container = document.getElementById('client-container');
            let html = '';
            const toShow = currentCategory === "ALL" ? libraryTree : libraryTree.filter(c => c.name === currentCategory);

            toShow.forEach(cat => {
                const filtered = cat.clients.filter(c => c.displayName.toLowerCase().includes(query.toLowerCase()));
                if (filtered.length > 0) {
                    html += `<div class="space-y-6">
                        <div class="flex items-center space-x-4 opacity-30"><span class="h-px flex-1 bg-zinc-700"></span><span class="text-[9px] font-black uppercase tracking-widest">${cat.displayName}</span><span class="h-px flex-1 bg-zinc-700"></span></div>
                        ${filtered.map(client => `
                            <div class="space-y-4">
                                <div class="flex items-center space-x-4">
                                    ${client.isPopular ? `<div class="relative w-12 h-12 flex-shrink-0"><img src="${client.iconUrl || ''}" class="w-full h-full rounded-xl object-cover border border-white/5 relative z-10"><div class="absolute inset-0 bg-[#347ccb]/20 blur-lg rounded-full"></div></div>` : ''}
                                    <h2 class="text-xl font-black text-white tracking-tight truncate">${client.displayName}</h2>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${client.files.map(file => {
                                        const cardClass = client.bannerUrl ? 'banner-card' : 'glass-card';
                                        return `
                                        <div class="${cardClass} p-6 group">
                                            ${client.bannerUrl ? `
                                                <img src="${client.bannerUrl}" class="banner-img">
                                                <div class="banner-gradient"></div>
                                            ` : ''}
                                            <div class="card-content flex items-center justify-between">
                                                <div class="min-w-0 pr-4">
                                                    <div class="text-white font-bold text-base truncate flex items-center"><i class="fa-solid fa-file-arrow-down mr-3 text-zinc-500"></i>${file.display}</div>
                                                    <div class="text-[10px] text-zinc-400 font-mono mt-1 truncate">${file.rawName}</div>
                                                </div>
                                                <a href="${file.url}" target="_blank" class="btn-download text-white text-[10px] font-black py-2.5 px-5 rounded-lg uppercase inline-flex items-center active:scale-95 transition-all"><i class="fa-solid fa-download mr-2"></i>Download</a>
                                            </div>
                                        </div>
                                    `}).join('')}
                                </div>

                                ${client.extensions.length > 0 ? `
                                    <div class="relative">
                                        <button onclick="toggleDropdown('${client.id}')" class="w-full glass-card p-4 flex items-center justify-between group active:scale-[0.98] transition-transform">
                                            <div class="flex items-center text-[10px] font-black uppercase tracking-widest text-[#347ccb]">
                                                <i class="fa-solid fa-puzzle-piece mr-3 text-zinc-500"></i>
                                                Extensions (${client.extensions.length})
                                            </div>
                                            <i id="icon-${client.id}" class="fa-solid fa-chevron-down text-zinc-600 transition-transform duration-300"></i>
                                        </button>
                                        <div id="drop-${client.id}" class="extension-dropdown mx-2 shadow-2xl">
                                            ${client.extensions.map(ext => `
                                                <div class="extension-row transition-colors">
                                                    <div class="min-w-0 pr-4">
                                                        <div class="text-xs font-bold text-zinc-200 truncate">${ext.display}</div>
                                                        <div class="text-[9px] text-zinc-600 font-mono truncate">${ext.rawName}</div>
                                                    </div>
                                                    <a href="${ext.url}" target="_blank" class="btn-download text-white text-[9px] font-black py-2 px-4 rounded-lg uppercase inline-flex items-center active:scale-95 transition-all">
                                                        <i class="fa-solid fa-download mr-2"></i>Download
                                                    </a>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>`;
                }
            });
            container.innerHTML = html || `<div class="text-center py-20 text-zinc-700 text-sm">No results found.</div>`;
        }

        document.getElementById('search-input').addEventListener('input', (e) => renderClients(e.target.value));
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
