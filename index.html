<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Indigo Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root { 
        --accent: #347ccb; 
        --bg: #0f1113; 
        --card: #1a1c1e; 
    }
    
    * {
        box-sizing: border-box;
    }
    
    body { 
        background-color: var(--bg); 
        color: #d1d5db; 
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    
    html {
        scroll-behavior: smooth;
    }
    
    /* Glass Card Styles */
    .glass-card { 
        background: var(--card); 
        border: 1px solid rgba(55, 65, 81, 0.5);
        border-radius: 0.75rem;
        transition: all 0.2s ease;
        will-change: transform, border-color;
    }
    
    .glass-card:hover {
        border-color: rgba(52, 124, 203, 0.3);
        transform: translateY(-2px);
    }
    
    /* Banner Card Styles */
    .banner-card {
        background: linear-gradient(135deg, rgba(26, 28, 30, 0.9) 0%, rgba(26, 28, 30, 0.7) 100%);
        border: 1px solid rgba(55, 65, 81, 0.5);
        border-radius: 0.75rem;
        position: relative;
        overflow: hidden;
        will-change: transform;
    }
    
    .banner-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    }
    
    .banner-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(15,17,19,0.9) 0%, rgba(15,17,19,0.7) 100%);
        z-index: 1;
    }
    
    .card-content { 
        position: relative; 
        z-index: 10; 
        width: 100%; 
        height: 100%; 
    }
    
    /* Extension Dropdown - Fixed */
    .extension-container {
        position: relative;
        transition: all 0.3s ease;
    }
    
    .extension-dropdown {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        opacity: 0;
        background: rgba(26, 28, 30, 0.95);
        border: 1px solid rgba(55, 65, 81, 0.5);
        border-top: none;
        border-radius: 0 0 0.75rem 0.75rem;
        margin-top: -1px;
    }
    
    .extension-dropdown.open {
        max-height: 2000px;
        opacity: 1;
        padding: 1rem 0;
    }
    
    .extension-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem;
        border-top: 1px solid rgba(55, 65, 81, 0.3);
        transition: background 0.2s ease;
        transform-origin: top;
        animation: slideDown 0.3s ease-out forwards;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .extension-row:hover {
        background: rgba(255, 255, 255, 0.02);
    }
    
    /* Tabs */
    .tab-active { 
        background: rgba(52, 124, 203, 0.1) !important;
        color: white !important;
        border: 1px solid rgba(52, 124, 203, 0.3) !important;
    }
    
    /* Buttons */
    .btn-download {
        background: linear-gradient(135deg, #347ccb 0%, #2a68a8 100%);
        color: white;
        font-weight: 600;
        border-radius: 0.5rem;
        transition: all 0.2s ease;
        will-change: transform;
    }
    
    .btn-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(52, 124, 203, 0.3);
    }
    
    .section-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1.5rem 0 1rem 0;
        color: #6b7280;
    }
    
    .section-divider::before, .section-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(55, 65, 81, 0.5);
    }
    
    .section-divider span {
        padding: 0 1rem;
        background: var(--bg);
    }
    
    .show-more-btn {
        background: rgba(26, 28, 30, 0.7);
        border: 1px solid rgba(55, 65, 81, 0.5);
        color: #9ca3af;
        border-radius: 0.625rem;
        width: 100%;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        will-change: transform;
    }
    
    .show-more-btn:hover { 
        background: rgba(55, 65, 81, 0.3); 
        color: white; 
        transform: translateY(-1px);
    }
    
    .client-collapse-btn {
        padding: 0.5rem 0.875rem;
        border-radius: 0.5rem;
        background: rgba(26, 28, 30, 0.7);
        border: 1px solid rgba(55, 65, 81, 0.5);
        font-size: 0.75rem;
        font-weight: 600;
        color: #9ca3af;
        transition: all 0.2s ease;
        min-height: 36px;
        min-width: 44px;
    }
    
    .client-collapse-btn:hover { 
        color: white; 
        background: rgba(55, 65, 81, 0.3);
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    
    ::-webkit-scrollbar-track {
        background: rgba(15, 17, 19, 0.5);
        border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
        background: #347ccb;
        border-radius: 4px;
        transition: background 0.2s ease;
    }
    
    ::-webkit-scrollbar-thumb:hover {
        background: #2a68a8;
    }
    
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    
    /* Loading */
    #loader {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(52, 124, 203, 0.2);
        border-top-color: #347ccb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* Animations */
    @keyframes fadeIn {
        from { 
            opacity: 0; 
            transform: translateY(10px);
        }
        to { 
            opacity: 1; 
            transform: translateY(0);
        }
    }
    
    @keyframes scaleIn {
        from { 
            opacity: 0; 
            transform: scale(0.95);
        }
        to { 
            opacity: 1; 
            transform: scale(1);
        }
    }
    
    #main-content {
        animation: fadeIn 0.4s ease-out;
    }
    
    /* Description Panel */
    .description-panel {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        transform: translateY(-10px);
    }
    
    .description-panel.expanded {
        max-height: 2000px;
        opacity: 1;
        margin-top: 1rem;
        transform: translateY(0);
    }
    
    .description-content {
        background: rgba(26, 28, 30, 0.7);
        border: 1px solid rgba(55, 65, 81, 0.5);
        border-radius: 0.75rem;
        padding: 1.25rem;
        line-height: 1.6;
        font-size: 0.875rem;
        color: #d1d5db;
        animation: scaleIn 0.3s ease-out;
    }
    
    .description-toggle-btn {
        background: transparent;
        border: none;
        color: #347ccb;
        font-size: 0.75rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        transition: all 0.2s ease;
        cursor: pointer;
    }
    
    .description-toggle-btn:hover {
        background: rgba(52, 124, 203, 0.1);
    }
    
    .description-toggle-btn i {
        transition: transform 0.3s ease;
    }
    
    .description-toggle-btn.expanded i {
        transform: rotate(180deg);
    }
    
    /* Extension Button */
    .extension-btn {
        position: relative;
        overflow: hidden;
        transition: all 0.2s ease;
    }
    
    .extension-btn i {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .extension-btn.open i {
        transform: rotate(180deg);
    }
    
    .extension-btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(52, 124, 203, 0.1);
        opacity: 0;
        transition: opacity 0.2s ease;
    }
    
    .extension-btn:hover::after {
        opacity: 1;
    }
    
    /* Screenshots Modal - Enhanced */
    .screenshots-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        animation: fadeIn 0.3s ease-out;
    }
    
    .screenshots-modal.active {
        display: flex;
    }
    
    .screenshot-content {
        max-width: 95vw;
        max-height: 95vh;
        position: relative;
        width: 100%;
        animation: scaleIn 0.3s ease-out;
    }
    
    .screenshot-main-container {
        position: relative;
        border-radius: 0.75rem;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.5);
    }
    
    .screenshot-img {
        width: 100%;
        height: auto;
        max-height: 70vh;
        object-fit: contain;
        display: block;
        cursor: zoom-in;
        transition: transform 0.3s ease;
    }
    
    .screenshot-img.zoomed {
        transform: scale(1.5);
        cursor: zoom-out;
    }
    
    .screenshot-close {
        position: absolute;
        top: -48px;
        right: 0;
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 1001;
    }
    
    .screenshot-close:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
    }
    
    .screenshot-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 1001;
    }
    
    .screenshot-nav:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-50%) scale(1.1);
    }
    
    .screenshot-prev {
        left: 1rem;
    }
    
    .screenshot-next {
        right: 1rem;
    }
    
    .screenshot-counter {
        position: absolute;
        bottom: 1rem;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        font-size: 0.875rem;
        background: rgba(0, 0, 0, 0.5);
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        display: inline-block;
        width: fit-content;
        margin: 0 auto;
    }
    
    .screenshot-thumbnails {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding: 1rem 0;
        margin-top: 1rem;
        justify-content: center;
    }
    
    .screenshot-thumbnail {
        width: 80px;
        height: 60px;
        object-fit: cover;
        border-radius: 0.375rem;
        cursor: pointer;
        opacity: 0.6;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    
    .screenshot-thumbnail:hover {
        opacity: 0.8;
        transform: translateY(-2px);
    }
    
    .screenshot-thumbnail.active {
        opacity: 1;
        border: 2px solid #347ccb;
        box-shadow: 0 4px 12px rgba(52, 124, 203, 0.3);
    }
    
    /* Screenshot Grid in Panel */
    .screenshot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.75rem;
        margin-top: 1rem;
    }
    
    .screenshot-item {
        position: relative;
        border-radius: 0.5rem;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        aspect-ratio: 16/9;
        background: rgba(0, 0, 0, 0.2);
        will-change: transform;
    }
    
    .screenshot-item:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        z-index: 1;
    }
    
    .screenshot-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
    }
    
    .screenshot-item:hover img {
        transform: scale(1.05);
    }
    
    .screenshot-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent 50%);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0.75rem;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    
    .screenshot-item:hover .screenshot-overlay {
        opacity: 1;
    }
    
    .screenshot-number {
        color: white;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(52, 124, 203, 0.8);
        padding: 0.25rem 0.5rem;
        border-radius: 2rem;
    }
    
    /* Author Info */
    .author-info {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(55, 65, 81, 0.3);
    }
    
    /* Responsive Design */
    @media (max-width: 640px) {
        .glass-card, .banner-card {
            border-radius: 0.625rem;
        }
        
        .extension-dropdown {
            border-radius: 0 0 0.625rem 0.625rem;
        }
        
        .screenshot-grid {
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.5rem;
        }
        
        .screenshot-item {
            aspect-ratio: 4/3;
        }
        
        .screenshot-nav {
            width: 40px;
            height: 40px;
        }
        
        .screenshot-prev {
            left: 0.5rem;
        }
        
        .screenshot-next {
            right: 0.5rem;
        }
        
        .screenshot-thumbnail {
            width: 60px;
            height: 45px;
        }
        
        .screenshot-img {
            max-height: 60vh;
        }
    }
    
    @media (min-width: 641px) and (max-width: 768px) {
        .screenshot-grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
        
        .screenshot-img {
            max-height: 65vh;
        }
    }
    
    @media (min-width: 769px) {
        .screenshot-grid {
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }
    }
    
    /* Category Tabs */
    #category-tabs-container {
        position: relative;
        overflow: hidden;
    }
    
    #category-tabs {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 0.5rem 0;
        gap: 0.5rem;
        scroll-behavior: smooth;
    }
    
    #category-tabs button {
        white-space: nowrap;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #9ca3af;
        transition: all 0.2s ease;
        background: rgba(26, 28, 30, 0.7);
        border: 1px solid rgba(55, 65, 81, 0.3);
        flex-shrink: 0;
    }
    
    #category-tabs button:hover {
        background: rgba(55, 65, 81, 0.3);
        color: white;
    }
    
    /* Touch Improvements */
    @media (hover: none) {
        .glass-card:hover,
        .banner-card:hover,
        .btn-download:hover,
        .show-more-btn:hover,
        .screenshot-item:hover {
            transform: none;
        }
        
        .glass-card:active,
        .banner-card:active {
            border-color: rgba(52, 124, 203, 0.3);
        }
        
        .btn-download:active {
            transform: translateY(-2px);
        }
        
        .screenshot-item:active {
            transform: scale(0.98);
        }
    }
    
    /* Performance Optimizations */
    .performance-optimized {
        will-change: transform, opacity;
        backface-visibility: hidden;
        -webkit-font-smoothing: antialiased;
    }
    
    /* Loading Animation */
    .loading-shimmer {
        background: linear-gradient(
            90deg,
            rgba(26, 28, 30, 0.5) 25%,
            rgba(55, 65, 81, 0.5) 50%,
            rgba(26, 28, 30, 0.5) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
    }
    
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
  </style>
</head>

<body class="min-h-screen font-sans antialiased bg-[#0f1113] text-gray-300 performance-optimized">
  
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    
    <!-- Header -->
    <header class="text-center mb-8 sm:mb-12">
      <div class="inline-flex items-center justify-center p-3 rounded-xl bg-gradient-to-br from-[#347ccb]/15 to-[#347ccb]/5 mb-4 animate-pulse">
        <i class="fa-solid fa-box-open text-[#347ccb] text-2xl"></i>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">Indigo Library</h1>
      <p class="text-gray-500 text-xs font-medium tracking-wider">mca.glacierclient.xyz</p>
    </header>

    <!-- Loading State -->
    <div id="status-container" class="flex flex-col items-center justify-center py-16">
      <div id="loader" class="w-10 h-10 border-3 border-[#347ccb]/30 border-t-[#347ccb] rounded-full animate-spin"></div>
      <p id="status-text" class="mt-4 text-gray-500">Indexing Library...</p>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden">
      
      <!-- Category Navigation -->
      <div class="sticky top-0 z-40 bg-[#0f1113]/90 backdrop-blur-md border-b border-gray-800/50 mb-6 -mx-4 sm:-mx-6 px-4 sm:px-6">
        <div id="category-tabs-container" class="relative">
          <div id="category-tabs" class="flex overflow-x-auto py-3 gap-2 scrollbar-hide"></div>
          <div class="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-[#0f1113] to-transparent pointer-events-none"></div>
          <div class="absolute left-0 top-0 bottom-0 w-8 bg-gradient-to-r from-[#0f1113] to-transparent pointer-events-none"></div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="max-w-2xl mx-auto mb-8 px-4 sm:px-0">
        <div class="relative">
          <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="text" id="search-input" 
                 placeholder="Search clients, versions, or extensions..." 
                 class="w-full bg-[#1a1c1e] border border-gray-800 rounded-lg pl-12 pr-4 py-3 text-white focus:outline-none focus:border-[#347ccb] focus:ring-1 focus:ring-[#347ccb]/30 transition-all duration-200">
        </div>
      </div>

      <!-- Client Container -->
      <div id="client-container" class="space-y-8 pb-12 px-4 sm:px-0"></div>

    </div>
  </div>

  <!-- Screenshots Modal -->
  <div id="screenshots-modal" class="screenshots-modal" onclick="closeScreenshots()">
    <div class="screenshot-content" onclick="event.stopPropagation()">
      <button class="screenshot-close" onclick="closeScreenshots()" aria-label="Close">
        <i class="fa-solid fa-times"></i>
      </button>
      
      <button class="screenshot-nav screenshot-prev" onclick="prevScreenshot()" aria-label="Previous">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      
      <button class="screenshot-nav screenshot-next" onclick="nextScreenshot()" aria-label="Next">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      
      <div class="screenshot-main-container">
        <img id="screenshot-main" class="screenshot-img" src="" alt="Screenshot" onclick="toggleZoom()">
        <div id="screenshot-counter" class="screenshot-counter"></div>
      </div>
      
      <div id="screenshot-thumbnails" class="screenshot-thumbnails"></div>
    </div>
  </div>

  <script>
    const GITHUB_ORG = 'Indigo-Tools';
    const REPO_NAME = 'ClientLibrary';
    const BRANCH = 'main';
    const BASE_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_ORG}/${REPO_NAME}/${BRANCH}`;

    let libraryTree = [];
    let currentCategory = "ALL";
    const CATEGORY_ORDER = ["ALL", "Popular Clients", "Optifine Packs", "1_20", "1_19", "1_18", "1_17", "1_16"];

    const expandedFiles = new Set();
    const hiddenClients = new Set();
    const expandedDescriptions = new Set();
    const expandedExtensions = new Set();

    const TAG_COLORS = {
        'working': { bg: 'from-emerald-500/20 to-green-500/20', text: 'text-emerald-300', border: 'border-emerald-500/30', icon: 'fa-check-circle' },
        'legacy': { bg: 'from-amber-500/20 to-orange-500/20', text: 'text-amber-300', border: 'border-amber-500/30', icon: 'fa-history' },
        'trash': { bg: 'from-rose-500/20 to-red-500/20', text: 'text-rose-300', border: 'border-rose-500/30', icon: 'fa-trash' }
    };

    // Screenshots state
    let currentScreenshots = [];
    let currentScreenshotIndex = 0;
    let currentClientId = '';
    let isZoomed = false;

    function formatName(name) {
        if (!name) return "";
        return name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
    }

    function formatFileSize(bytes) {
        if (!bytes) return null;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        if (bytes === 0) return '0 B';
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + sizes[i];
    }

    async function getFileSize(url) {
        try {
            const response = await fetch(url, { method: 'HEAD' });
            const size = response.headers.get('content-length');
            return size ? parseInt(size) : null;
        } catch {
            return null;
        }
    }

    // Screenshots functions
    function openScreenshots(clientId, screenshots, index = 0) {
        currentScreenshots = screenshots;
        currentScreenshotIndex = index;
        currentClientId = clientId;
        isZoomed = false;
        
        const modal = document.getElementById('screenshots-modal');
        const mainImg = document.getElementById('screenshot-main');
        const counter = document.getElementById('screenshot-counter');
        const thumbnails = document.getElementById('screenshot-thumbnails');
        
        if (screenshots.length > 0) {
            mainImg.src = screenshots[index].url;
            mainImg.classList.remove('zoomed');
            counter.textContent = `${index + 1} / ${screenshots.length}`;
            
            // Create thumbnails
            thumbnails.innerHTML = screenshots.map((screenshot, i) => `
                <img src="${screenshot.url}" 
                     class="screenshot-thumbnail ${i === index ? 'active' : ''}" 
                     onclick="showScreenshot(${i})"
                     alt="Thumbnail ${i + 1}"
                     loading="lazy">
            `).join('');

    function closeScreenshots() {
        const modal = document.getElementById('screenshots-modal');
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
        currentScreenshots = [];
        currentScreenshotIndex = 0;
        currentClientId = '';
        isZoomed = false;
    }

    function showScreenshot(index) {
        if (index >= 0 && index < currentScreenshots.length) {
            currentScreenshotIndex = index;
            isZoomed = false;
            
            const mainImg = document.getElementById('screenshot-main');
            const counter = document.getElementById('screenshot-counter');
            const thumbnails = document.querySelectorAll('.screenshot-thumbnail');
            
            mainImg.src = currentScreenshots[index].url;
            mainImg.classList.remove('zoomed');
            counter.textContent = `${index + 1} / ${currentScreenshots.length}`;
            
            thumbnails.forEach((thumb, i) => {
                thumb.classList.toggle('active', i === index);
            });
        }

    function toggleZoom() {
        const mainImg = document.getElementById('screenshot-main');
        isZoomed = !isZoomed;
        mainImg.classList.toggle('zoomed', isZoomed);
    }

    function nextScreenshot() {
        const nextIndex = (currentScreenshotIndex + 1) % currentScreenshots.length;
        showScreenshot(nextIndex);
    }

    function prevScreenshot() {
        const prevIndex = currentScreenshotIndex === 0 ? currentScreenshots.length - 1 : currentScreenshotIndex - 1;
        showScreenshot(prevIndex);
    }

    const smartSort = (a, b) => {
        return a.rawName.localeCompare(b.rawName, undefined, {
            numeric: true,
            sensitivity: 'base'
        });
    };

    function isOptifinePack(clientName, description) {
        const nameLower = clientName.toLowerCase();
        const descLower = description ? description.toLowerCase() : '';
        
        const optifineKeywords = ['opti', 'fps', 'performance', 'boost', 'optimize', 'optimization'];
        
        return optifineKeywords.some(keyword => 
            nameLower.includes(keyword) || descLower.includes(keyword)
        );
    }

    function detectTags(parts) {
        const tags = [];
        const tagFiles = ['working', 'legacy', 'trash'];
        
        tagFiles.forEach(tag => {
            if (parts.some(part => part.toLowerCase() === tag)) {
                tags.push(tag);
            }
        });
        
        return tags;
    }

    function isDiscordLink(str) {
        if (!str) return false;
        const lowerStr = str.toLowerCase();
        return lowerStr.includes('discord.gg/') || 
               lowerStr.includes('discord.com/invite/') ||
               lowerStr.includes('discord.com/invite') ||
               lowerStr.includes('discord.glacierclient.xyz') ||
               (lowerStr.includes('discord') && lowerStr.includes('.'));
    }

    function formatDiscordLink(discordStr) {
        if (!discordStr) return '';
        
        const trimmed = discordStr.trim();
        
        if (isDiscordLink(trimmed)) {
            let url = trimmed;
            if (!url.startsWith('http')) {
                if (url.includes('discord.gg/') || url.includes('discord.com/invite/')) {
                    url = 'https://' + url;
                } else if (url.includes('discord.glacierclient.xyz')) {
                    url = 'https://' + url;
                } else if (url.match(/^[a-zA-Z0-9]+$/)) {
                    url = 'https://discord.gg/' + url;
                }
            }
            return `<a href="${url}" target="_blank" class="text-[#347ccb] hover:underline transition-colors">${trimmed.replace(/^https?:\/\//, '').replace('discord.gg/', '')}</a>`;
        }
        
        return `<span class="text-gray-300">${trimmed}</span>`;
    }

    async function init() {
        try {
            const response = await fetch(`${BASE_RAW_URL}/paths.json?t=${Date.now()}`);
            const rawPaths = await response.json();
            const structured = {};
            const descriptionPromises = [];
            const sizePromises = [];

            // First pass: Collect all data and identify Optifine packs
            rawPaths.forEach(path => {
                const parts = path.split('/');
                if (parts.length < 3) return;

                const category = parts[1];
                const fileName = parts[parts.length - 1];
                const clientName = parts[2];

                if (!structured[category]) structured[category] = {};
                if (!structured[category][clientName]) {
                    structured[category][clientName] = {
                        icon: null,
                        banner: null,
                        description: null,
                        author: null,
                        tags: [],
                        screenshots: [],
                        files: [],
                        extensions: [],
                        isOptifine: false
                    };
                }

                const encodedPath = path.split('/').map(p => encodeURIComponent(p)).join('/');
                const fullUrl = `${BASE_RAW_URL}/${encodedPath}`;
                const lowerName = fileName.toLowerCase();

                if (lowerName === 'pack_icon.png') {
                    structured[category][clientName].icon = fullUrl;
                } else if (lowerName === 'pack_banner.png') {
                    structured[category][clientName].banner = fullUrl;
                } else if (lowerName === 'description.txt' || lowerName === 'description.md') {
                    const descPromise = fetch(fullUrl)
                        .then(res => res.ok ? res.text() : null)
                        .then(text => {
                            if (text) {
                                structured[category][clientName].description = text;
                                // Check if this is an Optifine pack based on description
                                if (!structured[category][clientName].isOptifine) {
                                    structured[category][clientName].isOptifine = isOptifinePack(clientName, text);
                                }
                            }
                        })
                        .catch(() => {});
                    descriptionPromises.push(descPromise);
                } else if (lowerName === 'author.json' || lowerName === 'creator.json') {
                    const authorPromise = fetch(fullUrl)
                        .then(res => res.ok ? res.json() : null)
                        .then(author => {
                            if (author) {
                                structured[category][clientName].author = author;
                            }
                        })
                        .catch(() => {});
                    descriptionPromises.push(authorPromise);
                } else if (lowerName.match(/\.(png|jpg|jpeg|gif|webp)$/) && 
                          (parts.some(p => p.toLowerCase() === 'screenshots') || 
                           fileName.toLowerCase().includes('screenshot'))) {
                    structured[category][clientName].screenshots.push({
                        url: fullUrl,
                        name: fileName
                    });
                } else if (lowerName === 'working' || lowerName === 'legacy' || lowerName === 'trash') {
                    const tag = lowerName;
                    if (!structured[category][clientName].tags.includes(tag)) {
                        structured[category][clientName].tags.push(tag);
                    }
                } else {
                    const tags = detectTags(parts);
                    tags.forEach(tag => {
                        if (!structured[category][clientName].tags.includes(tag)) {
                            structured[category][clientName].tags.push(tag);
                        }
                    });
                    
                    const isExtension = parts.some(p => p.toLowerCase() === 'extensions');
                    
                    if (lowerName.match(/\.(zip|dll|so|apk|mcpack|mcaddon)$/)) {
                        const fileObj = { 
                            display: formatName(fileName), 
                            rawName: fileName, 
                            url: fullUrl,
                            size: null
                        };
                        
                        // Add file size fetch
                        const sizePromise = getFileSize(fullUrl).then(size => {
                            fileObj.size = formatFileSize(size);
                        }).catch(() => {});
                        sizePromises.push(sizePromise);
                        
                        if (isExtension) {
                            structured[category][clientName].extensions.push(fileObj);
                        } else {
                            structured[category][clientName].files.push(fileObj);
                        }
                    }
                }
            });

            await Promise.allSettled(descriptionPromises);
            await Promise.allSettled(sizePromises);

            // Second pass: Move Optifine packs to Optifine Packs category
            const optifineClients = {};

            Object.keys(structured).forEach(category => {
                if (category === "Optifine Packs") return;
                
                Object.entries(structured[category]).forEach(([clientName, data]) => {
                    // Check if this is an Optifine pack
                    const isOptifine = data.isOptifine || isOptifinePack(clientName, data.description);
                    
                    if (isOptifine) {
                        if (!optifineClients[clientName]) {
                            optifineClients[clientName] = {
                                icon: data.icon,
                                banner: data.banner,
                                description: data.description,
                                author: data.author,
                                tags: [...data.tags],
                                screenshots: [...data.screenshots],
                                files: [...data.files],
                                extensions: [...data.extensions],
                                originalCategory: category,
                                isOptifine: true
                            };
                        } else {
                            optifineClients[clientName].files.push(...data.files);
                            optifineClients[clientName].extensions.push(...data.extensions);
                            optifineClients[clientName].screenshots.push(...data.screenshots);
                            optifineClients[clientName].tags = [...new Set([...optifineClients[clientName].tags, ...data.tags])];
                        }
                        
                        // Remove from original category
                        delete structured[category][clientName];
                    }
                });
            });

            // Create Optifine Packs category if we have any
            if (Object.keys(optifineClients).length > 0) {
                structured["Optifine Packs"] = optifineClients;
            }

            // Remove empty categories
            Object.keys(structured).forEach(category => {
                if (Object.keys(structured[category]).length === 0) {
                    delete structured[category];
                }
            });

            libraryTree = Object.entries(structured)
                .sort((a, b) => {
                    const aIndex = CATEGORY_ORDER.indexOf(a[0]);
                    const bIndex = CATEGORY_ORDER.indexOf(b[0]);
                    if (aIndex === -1 && bIndex === -1) return a[0].localeCompare(b[0]);
                    if (aIndex === -1) return 1;
                    if (bIndex === -1) return -1;
                    return aIndex - bIndex;
                })
                .map(([catName, clients]) => {
                    const sortedClients = Object.entries(clients)
                        .map(([cliName, data]) => {
                            const clientData = {
                                id: 'client_' + cliName.replace(/[^a-zA-Z0-9]/g, '_') + '_' + catName.replace(/[^a-zA-Z0-9]/g, '_'),
                                displayName: formatName(cliName),
                                rawName: cliName,
                                iconUrl: data.icon,
                                bannerUrl: data.banner,
                                description: data.description,
                                author: data.author,
                                tags: [...new Set(data.tags)].sort(),
                                screenshots: data.screenshots,
                                files: data.files.sort(smartSort),
                                extensions: data.extensions.sort(smartSort),
                                isPopular: catName === "Popular Clients",
                                isOptifine: catName === "Optifine Packs" || data.isOptifine,
                                originalCategory: data.originalCategory
                            };
                            
                            if (clientData.isOptifine && data.originalCategory) {
                                clientData.displayName = formatName(cliName);
                            }
                            
                            return clientData;
                        })
                        .filter(c => c.files.length > 0 || c.extensions.length > 0)
                        .sort((a, b) => a.displayName.localeCompare(b.displayName));

                    return {
                        name: catName,
                        displayName: catName.startsWith('1_') ? `Version: ${catName.replace('_', '.')}` : catName,
                        clients: sortedClients
                    };
                })
                .filter(cat => cat.clients.length > 0);

            document.getElementById('status-container').style.opacity = '0';
            document.getElementById('status-container').style.transition = 'opacity 0.3s ease';

            setTimeout(() => {
                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                renderTabs();
                switchCategory("ALL");

                const mainContent = document.getElementById('main-content');
                mainContent.style.opacity = '0';
                mainContent.style.transition = 'opacity 0.3s ease';
                mainContent.style.opacity = '1';
            }, 200);
        } catch (err) {
            console.error('Failed to load library:', err);
            document.getElementById('status-text').textContent = "Failed to load library. Please check connection.";
            document.getElementById('loader').classList.add('hidden');
        }
    }

    function renderTabs() {
        const container = document.getElementById('category-tabs');
        const tabs = ["ALL", ...libraryTree.map(c => c.name)];
        
        container.innerHTML = tabs.map(t => {
            let label = t === "ALL" ? "All" : t;
            if (t.startsWith('1_')) {
                label = t.replace('_', '.');
            }
            
            const displayName = t.startsWith('1_') ? `Version: ${label}` : label;
            
            return `
                <button onclick="switchCategory('${t}')" 
                        id="tab-${t}" 
                        class="text-sm font-medium text-gray-400 hover:text-white transition-colors duration-200 whitespace-nowrap px-3 sm:px-4 performance-optimized">
                    ${displayName}
                </button>
            `;
        }).join('');
    }

    function switchCategory(name) {
        currentCategory = name;
        
        document.querySelectorAll('#category-tabs button').forEach(btn => {
            btn.classList.remove('tab-active');
        });
        
        const activeTab = document.getElementById(`tab-${name}`);
        if (activeTab) {
            activeTab.classList.add('tab-active');
        }
        
        renderClients();
        
        // Smooth scroll for mobile
        if (window.innerWidth < 768) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function renderClients(query = '') {
        const container = document.getElementById('client-container');
        const q = query.toLowerCase().trim();
        const toShow = currentCategory === "ALL" ? libraryTree : libraryTree.filter(c => c.name === currentCategory);

        if (toShow.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12 animate-fadeIn">
                    <div class="inline-flex p-4 rounded-xl bg-gradient-to-br from-[#347ccb]/10 to-transparent mb-4">
                        <i class="fa-solid fa-search text-[#347ccb] text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-white mb-2">No content available</h3>
                    <p class="text-gray-500 text-sm">This category is empty</p>

            return;

        let html = '';
        
        toShow.forEach(cat => {
            const filteredClients = cat.clients.map(client => {
                const clientMatch = client.displayName.toLowerCase().includes(q);
                const descriptionMatch = client.description && client.description.toLowerCase().includes(q);
                const authorMatch = client.author && (
                    (client.author.name && client.author.name.toLowerCase().includes(q)) ||
                    (client.author.website && client.author.website.toLowerCase().includes(q)) ||
                    (client.author.discord && client.author.discord.toLowerCase().includes(q)) ||
                    (client.author.github && client.author.github.toLowerCase().includes(q))

                                    </div>
                                </div>
                                <button onclick="toggleDescription('${client.id}')" 
                                        class="description-toggle-btn ${isDescriptionExpanded ? 'expanded' : ''} performance-optimized"
                                        aria-label="${isDescriptionExpanded ? 'Hide details' : 'Show details'}">
                                    ${isDescriptionExpanded ? 'Hide Details' : 'Show Details'}
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </button>
                            ` : ''}

                            <div class="${isHidden ? 'hidden' : ''} space-y-4">
                                ${client.matchingFiles.length > 0 ? `
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        ${filesToDisplay.map((file, index) => {
                                            const cardClass = client.bannerUrl ? 'banner-card' : 'glass-card';
                                            const isMobile = window.innerWidth < 768;

                                            return `
                                            <div class="${cardClass} performance-optimized" style="animation-delay: ${index * 50}ms">
                                                ${client.bannerUrl ? `
                                                    <img src="${client.bannerUrl}" class="banner-img" alt="${client.displayName} banner" loading="lazy">
                                                    <div class="banner-gradient"></div>
                                                ` : ''}
                                                <div class="card-content flex ${isMobile ? 'flex-col items-start' : 'items-center justify-between'} gap-3 p-4 sm:p-6">
                                                    <div class="min-w-0 ${isMobile ? 'w-full' : 'pr-4'}">
                                                        <div class="text-white font-semibold text-sm sm:text-base truncate flex items-center">
                                                            <i class="fa-solid fa-file-arrow-down mr-2 text-gray-500"></i>
                                                            ${file.display}
                                                        </div>
                                                        <div class="text-xs text-gray-400 font-mono mt-0.5 truncate">
                                                            ${file.rawName}
                                                        </div>
                                                        ${file.size ? `
                                                            <div class="flex items-center gap-2 mt-2 text-xs text-gray-500">
                                                                <i class="fa-solid fa-weight-scale"></i>
                                                                <span>${file.size}</span>
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                    <a href="${file.url}" 
                                                       target="_blank" 
                                                       rel="noopener noreferrer"
                                                       class="btn-download text-white text-sm font-semibold py-2 px-4 rounded-lg inline-flex items-center justify-center ${isMobile ? 'w-full mt-3' : ''} performance-optimized">
                                                        <i class="fa-solid fa-download mr-1.5"></i>Download
                                                    </a>
                                                </div>
                                            </div>
                                        `}).join('')}
                                    </div>
                                ` : ''}

                                ${hasManyFiles && !isSearching && client.matchingFiles.length > 5 ? `
                                    <button onclick="toggleFileList('${client.id}')" 
                                            class="show-more-btn performance-optimized"
                                            aria-label="${isFilesExpanded ? 'Show less files' : 'Show more files'}">
                                        ${isFilesExpanded ?
                                            '<i class="fa-solid fa-angles-up"></i> <span>Show Less</span>' :
                                            `<i class="fa-solid fa-angles-down"></i> <span>Show ${client.matchingFiles.length - 5} more</span>`
                                        }
                                    </button>
                                ` : ''}

                                ${client.matchingExtensions.length > 0 ? `
                                    <div class="extension-container performance-optimized">
                                        <div class="section-divider">
                                            <span class="text-xs font-semibold uppercase tracking-wider text-gray-500">
                                                Extensions & Add-ons (${client.matchingExtensions.length})
                                            </span>
                                        </div>
                                        <button onclick="toggleDropdown('${client.id}')" 
                                                class="w-full glass-card p-3 sm:p-4 flex items-center justify-between extension-btn ${areExtensionsExpanded ? 'open' : ''} performance-optimized"
                                                aria-label="${areExtensionsExpanded ? 'Hide extensions' : 'Show extensions'}">
                                            <div class="flex items-center text-sm font-semibold text-[#347ccb]">
                                                <i class="fa-solid fa-puzzle-piece mr-2 text-gray-500"></i>
                                                Extensions (${client.matchingExtensions.length})
                                            </div>
                                            <i class="fa-solid fa-chevron-down text-gray-600 transition-transform duration-300"></i>
                                        </button>
                                        <div class="extension-dropdown ${areExtensionsExpanded ? 'open' : ''}">
                                            ${client.matchingExtensions.map((ext, index) => {
                                                const isMobile = window.innerWidth < 768;
                                                return `
                                                <div class="extension-row performance-optimized" style="animation-delay: ${index * 50}ms">
                                                    ${client.bannerUrl ? `
                                                        <img src="${client.bannerUrl}" class="banner-img opacity-20" loading="lazy">
                                                        <div class="banner-gradient"></div>
                                                    ` : ''}
                                                    <div class="card-content flex ${isMobile ? 'flex-col items-start' : 'items-center justify-between'} w-full gap-3">
                                                        <div class="min-w-0 ${isMobile ? 'w-full' : 'pr-4'}">
                                                            <div class="text-sm font-semibold text-gray-200 truncate">
                                                                ${ext.display}
                                                            </div>
                                                            <div class="text-xs text-gray-400 font-mono truncate">
                                                                ${ext.rawName}
                                                            </div>
                                                            ${ext.size ? `
                                                                <div class="flex items-center gap-2 mt-2 text-xs text-gray-500">
                                                                    <i class="fa-solid fa-weight-scale"></i>
                                                                    <span>${ext.size}</span>
                                                                </div>
                                                            ` : ''}
                                                        </div>
                                                        <a href="${ext.url}" 
                                                           target="_blank" 
                                                           rel="noopener noreferrer"
                                                           class="btn-download text-white text-sm font-semibold py-2 px-4 rounded-lg inline-flex items-center justify-center ${isMobile ? 'w-full mt-2' : ''} performance-optimized">
                                                            <i class="fa-solid fa-download mr-1.5"></i>Download
                                                        </a>
                                                    </div>
                                                </div>
                                            `}).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `; }).join('')}
                </div>`;
            }
        });

        container.innerHTML = html || `
            <div class="text-center py-12 animate-fadeIn">
                <div class="inline-flex p-4 rounded-xl bg-gradient-to-br from-[#347ccb]/10 to-transparent mb-4">
                    <i class="fa-solid fa-search text-[#347ccb] text-2xl"></i>
                </div>
                <h3 class="text-lg font-semibold text-white mb-2">No results found</h3>
                <p class="text-gray-500 text-sm">Try a different search term or browse the categories above</p>
            </div>
        `;
    }
    
    // Debounced search
    let searchDebounce;
    document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            renderClients(e.target.value);
        }, 150);
    });
    
    // Close modal on ESC key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeScreenshots();
        }
    });
    
    // Keyboard navigation for screenshots
    document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('screenshots-modal');
        if (modal.classList.contains('active')) {
            if (e.key === 'ArrowLeft') {
                prevScreenshot();
            } else if (e.key === 'ArrowRight') {
                nextScreenshot();
            } else if (e.key === 'z' || e.key === 'Z') {
                toggleZoom();
            }
        }
    });
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
        // Add CSS for animation
        const style = document.createElement('style');
        style.textContent = `
            .animate-fadeIn {
                animation: fadeIn 0.4s ease-out forwards;
            }
            @keyframes fadeIn {
                from { 
                    opacity: 0; 
                    transform: translateY(10px);
                }
                to { 
                    opacity: 1; 
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
        
        // Initialize the library
        init();
    });
    
    // Touch improvements
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });
    
    // Performance: debounce resize events
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            renderClients(document.getElementById('search-input').value);
        }, 250);
    });
  </script>
</body>
</html>
