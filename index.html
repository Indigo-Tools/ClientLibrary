<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Library Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1e2124; color: #cccccf; }
        .glass-card { background: #39393e; border: 1px solid #808080; position: relative; overflow: hidden; }
        .tab-active { border-bottom: 2px solid #347ccb; color: #ffffff; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e2124; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #808080; border-radius: 10px; }
        .btn-primary { background-color: #347ccb; }
        .btn-primary:hover { background-color: #2b66a8; }
        .banner-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.15; z-index: 0; filter: blur(2px); }
        .card-content { position: relative; z-index: 10; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <div class="max-w-5xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">Indigo Client Library</h1>
            <p class="text-[#808080]">mca.glacierclient.xyz</p>
        </header>

        <div id="status-container" class="flex flex-col items-center justify-center space-y-4 py-20">
            <div id="loader" class="w-10 h-10 border-3 border-[#347ccb] border-t-transparent rounded-full animate-spin"></div>
            <p id="status-text" class="text-[#808080] text-sm font-medium text-center max-w-md">Connecting to repository...</p>
            <button id="retry-btn" onclick="init()" class="hidden btn-primary text-white text-xs px-4 py-2 rounded mt-2 uppercase">Retry Connection</button>
        </div>

        <div id="main-content" class="hidden">
            <div class="flex items-center justify-between mb-6 border-b border-[#808080] overflow-x-auto custom-scrollbar">
                <nav id="category-tabs" class="flex space-x-8 whitespace-nowrap"></nav>
            </div>

            <div class="mb-8">
                <input type="text" id="search-input" placeholder="Search clients or files..." 
                       class="w-full bg-[#1e2124] border border-[#808080] rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#347ccb] text-[#cccccf]">
            </div>

            <div id="client-container" class="space-y-12"></div>
        </div>
    </div>

    <script>
        const GITHUB_ORG = 'Indigo-Tools'; 
        const REPO_NAME = 'ClientLibrary';
        const BRANCH = 'main';
        const BASE_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_ORG}/${REPO_NAME}/${BRANCH}`;
        
        let libraryTree = []; 
        let currentCategory = null;

        function formatName(name) {
            if (!name) return "";
            return name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        }

        function updateStatus(msg, isError = false) {
            const el = document.getElementById('status-text');
            const loader = document.getElementById('loader');
            const retryBtn = document.getElementById('retry-btn');
            el.innerText = msg;
            if (isError) {
                el.classList.add('text-red-500');
                loader.classList.add('hidden');
                retryBtn.classList.remove('hidden');
            } else {
                el.classList.remove('text-red-500');
                loader.classList.remove('hidden');
                retryBtn.classList.add('hidden');
            }
        }

        async function init() {
            updateStatus("Connecting to CDN...");
            try {
                const response = await fetch(`${BASE_RAW_URL}/paths.json?t=${Date.now()}`);
                if (!response.ok) throw new Error("Manifest not found. Ensure GitHub Action has run.");
                
                const rawPaths = await response.json();
                const structured = {};

                rawPaths.forEach(path => {
                    const parts = path.split('/');
                    if (parts.length < 2) return;

                    const category = parts[1];
                    const fileName = parts[parts.length - 1];
                    const clientName = parts.length > 3 ? parts[2] : fileName;

                    if (!structured[category]) structured[category] = {};
                    if (!structured[category][clientName]) {
                        structured[category][clientName] = { icon: null, banner: null, files: [] };
                    }

                    const encodedPath = path.split('/').map(p => encodeURIComponent(p)).join('/');
                    const fullUrl = `${BASE_RAW_URL}/${encodedPath}`;

                    if (fileName.toLowerCase() === 'pack_icon.png') {
                        structured[category][clientName].icon = fullUrl;
                    } else if (fileName.toLowerCase() === 'pack_banner.png') {
                        structured[category][clientName].banner = fullUrl;
                    } else if (fileName.toLowerCase().match(/\.(zip|dll|so|apk|mcpack|mcaddon)$/)) {
                        structured[category][clientName].files.push({
                            display: formatName(fileName),
                            rawName: fileName,
                            url: fullUrl
                        });
                    }
                });

                libraryTree = Object.entries(structured).map(([catName, clients]) => ({
                    name: catName,
                    displayName: formatName(catName),
                    clients: Object.entries(clients).map(([cliName, data]) => ({
                        displayName: formatName(cliName),
                        iconUrl: data.icon,
                        bannerUrl: data.banner,
                        files: data.files
                    })).filter(c => c.files.length > 0)
                })).filter(cat => cat.clients.length > 0);

                if (libraryTree.length === 0) throw new Error("No files found in library folders.");

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                renderTabs();
                switchCategory(libraryTree[0].name);

            } catch (err) {
                updateStatus(`Error: ${err.message}`, true);
            }
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = libraryTree.map(cat => `
                <button onclick="switchCategory('${cat.name}')" id="tab-${cat.name}" 
                        class="pb-3 text-sm font-medium text-[#808080] hover:text-[#cccccf] transition-colors uppercase tracking-widest">
                    ${cat.displayName}
                </button>
            `).join('');
        }

        function switchCategory(name) {
            currentCategory = libraryTree.find(c => c.name === name);
            document.querySelectorAll('#category-tabs button').forEach(btn => btn.classList.remove('tab-active', 'text-white'));
            const activeTab = document.getElementById(`tab-${name}`);
            if (activeTab) activeTab.classList.add('tab-active', 'text-white');
            renderClients();
        }

        function renderClients(query = '') {
            const container = document.getElementById('client-container');
            const filtered = currentCategory.clients.filter(c => 
                c.displayName.toLowerCase().includes(query.toLowerCase()) ||
                c.files.some(f => f.display.toLowerCase().includes(query.toLowerCase()))
            );

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center py-20 text-[#808080]">No results found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(client => `
                <div class="space-y-4">
                    <div class="flex items-center space-x-4">
                        ${client.iconUrl ? `<img src="${client.iconUrl}" class="w-12 h-12 rounded-lg object-cover border border-[#808080]/20">` : 
                          `<div class="w-12 h-12 bg-[#39393e] rounded-lg border border-[#808080]/20 flex items-center justify-center font-bold text-[#347ccb]">?</div>`}
                        <h2 class="text-2xl font-bold text-white">${client.displayName}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${client.files.map(file => `
                            <div class="glass-card rounded-xl p-5 flex items-center justify-between">
                                ${client.bannerUrl ? `<img src="${client.bannerUrl}" class="banner-bg">` : ''}
                                <div class="card-content flex flex-col min-w-0">
                                    <span class="text-sm font-bold text-white truncate">${file.display}</span>
                                    <span class="text-[10px] text-[#808080] font-mono mt-1 truncate">${file.rawName}</span>
                                </div>
                                <div class="card-content ml-4 flex-shrink-0">
                                    <a href="${file.url}" target="_blank" download="${file.rawName}"
                                       class="btn-primary text-white text-[11px] font-black py-2 px-5 rounded-md uppercase transition-transform active:scale-95 inline-block">
                                        Download
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => renderClients(e.target.value));
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
