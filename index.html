<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta property="og:title" content="Nyxora Library (Client Library)" />
  <meta property="og:description" content="Minecraft Client Archive, Clients from 1.16 MCPE to Newest MCPE Clients, Mainly focused on texture pack clients." />
  <meta property="og:url" content="https://mca.glacierclient.xyz" />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyxora Library</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="site-wrapper">

    <header class="site-header">
      <div class="header-icon">
        <i class="fa-solid fa-box-open"></i>
      </div>
      <h1 class="header-title">Nyxora Library</h1>
      <p class="header-subtitle">mca.glacierclient.xyz</p>
    </header>

    <div id="status-container" class="loading-state">
      <div class="spinner"></div>
      <p id="status-text" class="loading-text">Indexing Library...</p>
    </div>

    <div id="main-content" class="hidden">

      <!-- Category tabs with cycler arrows -->
      <nav class="tabs-bar">
        <button class="tab-scroll-btn tab-scroll-left" id="tab-scroll-left" aria-label="Scroll left">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div id="category-tabs" class="tabs-scroll"></div>
        <button class="tab-scroll-btn tab-scroll-right" id="tab-scroll-right" aria-label="Scroll right">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </nav>

      <!-- Search with dropdown -->
      <div class="search-wrapper" id="search-wrapper">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search-input"
               placeholder="Search clients, versions, or extensions..."
               class="search-input"
               autocomplete="off">
        <button id="search-clear" class="search-clear hidden" aria-label="Clear search">
          <i class="fa-solid fa-times"></i>
        </button>
        <div id="search-results-count" class="search-count hidden"></div>
        <div id="search-dropdown" class="search-dropdown hidden"></div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div id="stats-bar" class="stats-bar"></div>
        <div class="toolbar-actions">
          <button id="expand-all-btn" onclick="expandCollapseAll()" class="toolbar-btn">
            <i class="fa-solid fa-angles-down"></i>
            <span>Expand All</span>
          </button>
        </div>
      </div>

      <div id="client-container" class="client-list"></div>

    </div>
  </div>

  <!-- Back to top -->
  <button id="back-to-top" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">
    <i class="fa-solid fa-chevron-up"></i>
  </button>

  <!-- Screenshots Modal -->
  <div id="screenshots-modal" class="screenshots-modal" onclick="closeScreenshots()">
    <div class="screenshot-content" onclick="event.stopPropagation()">
      <button class="screenshot-close" onclick="closeScreenshots()" aria-label="Close">
        <i class="fa-solid fa-times"></i>
      </button>
      <button class="screenshot-nav screenshot-prev" onclick="prevScreenshot()" aria-label="Previous">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button class="screenshot-nav screenshot-next" onclick="nextScreenshot()" aria-label="Next">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      <div class="screenshot-main-container">
        <img id="screenshot-main" class="screenshot-img" src="" alt="Screenshot" onclick="toggleZoom()">
        <div id="screenshot-counter" class="screenshot-counter"></div>
      </div>
      <div id="screenshot-thumbnails" class="screenshot-thumbnails"></div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
