<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indigo Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #0f1113; color: #a1a1aa; }
        .glass-card { 
            background: #16181a; 
            border: 1px solid #282a2d; 
            transition: all 0.2s ease-in-out;
            position: relative;
            z-index: 1;
        }
        .glass-card:hover {
            border-color: #347ccb;
            background: #1c1f22;
        }
        .tab-active { 
            border-bottom: 3px solid #347ccb; 
            color: #ffffff !important; 
        }
        .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f1113; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f444a; border-radius: 10px; }
        
        .btn-download {
            background-color: #347ccb;
            box-shadow: 0 0 15px rgba(52, 124, 203, 0.3);
        }
        .btn-download:hover {
            background-color: #3d8be6;
            transform: scale(1.02);
        }
        
        .banner-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.1; z-index: 0; pointer-events: none;
        }
        .card-content { position: relative; z-index: 2; }
        
        /* Fixed overlay issues */
        #main-content { position: relative; z-index: 10; }
        .category-btn { transition: color 0.2s; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <div class="max-w-6xl mx-auto px-6 py-16">
        <header class="text-center mb-16">
            <div class="inline-block p-4 rounded-2xl bg-[#347ccb]/10 mb-6">
                <i class="fa-solid fa-box-open text-[#347ccb] text-4xl"></i>
            </div>
            <h1 class="text-5xl font-black text-white mb-2 tracking-tight">Indigo Library</h1>
            <p class="text-zinc-500 font-bold uppercase text-xs tracking-[0.3em]">
                mca.glacierclient.xyz
            </p>
        </header>

        <div id="status-container" class="flex flex-col items-center justify-center py-24">
            <div id="loader" class="w-12 h-12 border-4 border-[#347ccb]/20 border-t-[#347ccb] rounded-full animate-spin"></div>
            <p id="status-text" class="mt-6 text-zinc-500 font-medium tracking-wide">Connecting to archive...</p>
        </div>

        <div id="main-content" class="hidden space-y-10">
            <div class="border-b border-zinc-800/50 overflow-x-auto custom-scrollbar">
                <nav id="category-tabs" class="flex space-x-10 whitespace-nowrap px-2"></nav>
            </div>

            <div class="relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-zinc-600"></i>
                <input type="text" id="search-input" placeholder="Search for clients or versions..." 
                       class="w-full bg-[#16181a] border border-zinc-800 rounded-2xl pl-14 pr-6 py-5 text-white focus:outline-none focus:border-[#347ccb] transition-all placeholder:text-zinc-700">
            </div>

            <div id="client-container" class="space-y-20 pb-20"></div>
        </div>
    </div>

    <script>
        const GITHUB_ORG = 'Indigo-Tools'; 
        const REPO_NAME = 'ClientLibrary';
        const BRANCH = 'main';
        const BASE_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_ORG}/${REPO_NAME}/${BRANCH}`;
        
        let libraryTree = []; 
        let currentCategory = null; // Can be "ALL" or a category object

        const CATEGORY_ORDER = ["ALL", "Popular Clients", "1_20", "1_19", "1_18", "1_17", "1_16"];

        function formatName(name) {
            if (!name) return "";
            return name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        }

        async function init() {
            try {
                const response = await fetch(`${BASE_RAW_URL}/paths.json?t=${Date.now()}`);
                const rawPaths = await response.json();
                const structured = {};

                rawPaths.forEach(path => {
                    const parts = path.split('/');
                    if (parts.length < 2) return;

                    const category = parts[1];
                    const fileName = parts[parts.length - 1];
                    const clientName = parts.length > 3 ? parts[2] : fileName;

                    if (!structured[category]) structured[category] = {};
                    if (!structured[category][clientName]) {
                        structured[category][clientName] = { icon: null, banner: null, files: [] };
                    }

                    const encodedPath = path.split('/').map(p => encodeURIComponent(p)).join('/');
                    const fullUrl = `${BASE_RAW_URL}/${encodedPath}`;

                    if (fileName.toLowerCase() === 'pack_icon.png') {
                        structured[category][clientName].icon = fullUrl;
                    } else if (fileName.toLowerCase() === 'pack_banner.png') {
                        structured[category][clientName].banner = fullUrl;
                    } else if (fileName.toLowerCase().match(/\.(zip|dll|so|apk|mcpack|mcaddon)$/)) {
                        structured[category][clientName].files.push({
                            display: formatName(fileName),
                            rawName: fileName,
                            url: fullUrl
                        });
                    }
                });

                libraryTree = Object.entries(structured)
                    .sort((a, b) => {
                        let idxA = CATEGORY_ORDER.indexOf(a[0]);
                        let idxB = CATEGORY_ORDER.indexOf(b[0]);
                        return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
                    })
                    .map(([catName, clients]) => ({
                        name: catName,
                        displayName: catName.startsWith('1_') ? `Version: ${catName.replace('_', '.')}` : catName,
                        clients: Object.entries(clients).map(([cliName, data]) => ({
                            displayName: formatName(cliName),
                            iconUrl: data.icon,
                            bannerUrl: data.banner,
                            files: data.files,
                            isPopular: catName === "Popular Clients"
                        })).filter(c => c.files.length > 0)
                    })).filter(cat => cat.clients.length > 0);

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                renderTabs();
                switchCategory("ALL");

            } catch (err) {
                document.getElementById('status-text').innerText = "Error: " + err.message;
            }
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            const allBtn = `<button onclick="switchCategory('ALL')" id="tab-ALL" class="category-btn pb-4 text-sm font-bold text-zinc-500 hover:text-white uppercase tracking-widest">All</button>`;
            
            container.innerHTML = allBtn + libraryTree.map(cat => `
                <button onclick="switchCategory('${cat.name}')" id="tab-${cat.name}" 
                        class="category-btn pb-4 text-sm font-bold text-zinc-500 hover:text-white uppercase tracking-widest">
                    ${cat.displayName}
                </button>
            `).join('');
        }

        function switchCategory(name) {
            currentCategory = name;
            document.querySelectorAll('#category-tabs button').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`tab-${name}`).classList.add('tab-active');
            renderClients();
        }

        function renderClients(query = '') {
            const container = document.getElementById('client-container');
            let html = '';

            // Decide which categories to show
            const categoriesToShow = currentCategory === "ALL" ? libraryTree : libraryTree.filter(c => c.name === currentCategory);

            categoriesToShow.forEach(cat => {
                const filteredClients = cat.clients.filter(c => 
                    c.displayName.toLowerCase().includes(query.toLowerCase()) ||
                    c.files.some(f => f.display.toLowerCase().includes(query.toLowerCase()))
                );

                if (filteredClients.length > 0) {
                    html += `
                        <div class="space-y-8">
                            <div class="flex items-center space-x-4 opacity-50">
                                <span class="h-px flex-1 bg-zinc-800"></span>
                                <span class="text-[10px] font-black uppercase tracking-[0.4em]">${cat.displayName}</span>
                                <span class="h-px flex-1 bg-zinc-800"></span>
                            </div>
                            ${filteredClients.map(client => `
                                <div class="space-y-6">
                                    <div class="flex items-center space-x-5">
                                        ${client.isPopular ? `
                                            <div class="relative w-14 h-14 flex-shrink-0">
                                                <img src="${client.iconUrl || ''}" class="w-14 h-14 rounded-2xl object-cover shadow-2xl border border-white/5 relative z-10">
                                                <div class="absolute inset-0 bg-[#347ccb]/30 blur-xl rounded-full"></div>
                                            </div>
                                        ` : ''}
                                        <div>
                                            <h2 class="text-2xl font-black text-white tracking-tight">${client.displayName}</h2>
                                            <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mt-1">
                                                <i class="fa-solid fa-layer-group mr-2"></i> ${cat.displayName} | ${client.files.length} Files
                                            </p>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        ${client.files.map(file => `
                                            <div class="glass-card rounded-2xl p-6 flex items-center justify-between group">
                                                ${client.bannerUrl ? `<img src="${client.bannerUrl}" class="banner-bg">` : ''}
                                                <div class="card-content flex flex-col min-w-0">
                                                    <div class="text-white font-bold text-base truncate flex items-center">
                                                        <i class="fa-solid fa-file-arrow-down mr-3 text-zinc-600 group-hover:text-[#347ccb] transition-colors"></i>
                                                        ${file.display}
                                                    </div>
                                                    <div class="text-[10px] text-zinc-600 font-mono mt-2 truncate">${file.rawName}</div>
                                                </div>
                                                <div class="card-content ml-4 flex-shrink-0">
                                                    <a href="${file.url}" target="_blank" download="${file.rawName}"
                                                       class="btn-download text-white text-[11px] font-black py-3 px-6 rounded-xl uppercase transition-all inline-flex items-center">
                                                        <i class="fa-solid fa-download mr-2"></i> Download
                                                    </a>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            });

            container.innerHTML = html || `<div class="text-center py-20 text-zinc-600">No results found.</div>`;
        }

        document.getElementById('search-input').addEventListener('input', (e) => renderClients(e.target.value));
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
