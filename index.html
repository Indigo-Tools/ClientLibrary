<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Library Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1e2124;
            color: #cccccf;
        }
        .glass-card {
            background: #39393e;
            border: 1px solid #808080;
            position: relative;
            overflow: hidden;
        }
        .tab-active {
            border-bottom: 2px solid #347ccb;
            color: #ffffff;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e2124;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #808080;
            border-radius: 10px;
        }
        .btn-primary {
            background-color: #347ccb;
        }
        .btn-primary:hover {
            background-color: #2b66a8;
        }
        .banner-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            z-index: 0;
            filter: blur(2px);
        }
        .card-content {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <div class="max-w-5xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">Indigo Client Library</h1>
            <p class="text-[#808080]">mca.glacierclient.xyz</p>
        </header>

        <div id="status-container" class="flex flex-col items-center justify-center space-y-4 py-20">
            <div id="loader" class="w-10 h-10 border-3 border-[#347ccb] border-t-transparent rounded-full animate-spin"></div>
            <p id="status-text" class="text-[#808080] text-sm font-medium text-center max-w-md">Connecting to repository...</p>
            <button id="retry-btn" onclick="init()" class="hidden btn-primary text-white text-xs px-4 py-2 rounded mt-2 uppercase">Retry Connection</button>
        </div>

        <div id="main-content" class="hidden">
            <div class="flex items-center justify-between mb-6 border-b border-[#808080] overflow-x-auto custom-scrollbar">
                <nav id="category-tabs" class="flex space-x-8 whitespace-nowrap">
                </nav>
            </div>

            <div class="mb-8">
                <input type="text" id="search-input" placeholder="Search clients or files..." 
                       class="w-full bg-[#1e2124] border border-[#808080] rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#347ccb] text-[#cccccf]">
            </div>

            <div id="client-container" class="space-y-12">
            </div>
        </div>
    </div>

    <script>
        const GITHUB_ORG = 'Indigo-Tools'; 
        const REPO_NAME = 'ClientLibrary';
        const BRANCH = 'main';
        const ALLOWED_EXTENSIONS = ['.zip', '.dll', '.so', '.apk', '.mcpack', '.mcaddon'];
        
        const apiCache = new Map();
        let libraryTree = []; 
        let currentCategory = null;

        function updateStatus(msg, isError = false) {
            const el = document.getElementById('status-text');
            const loader = document.getElementById('loader');
            const retryBtn = document.getElementById('retry-btn');
            
            el.innerText = msg;
            if (isError) {
                el.classList.add('text-red-500');
                loader.classList.add('hidden');
                retryBtn.classList.remove('hidden');
            } else {
                el.classList.remove('text-red-500');
                loader.classList.remove('hidden');
                retryBtn.classList.add('hidden');
            }
        }

        async function apiFetch(path, retries = 3) {
            if (apiCache.has(path)) return apiCache.get(path);

            const url = `https://api.github.com/repos/${GITHUB_ORG}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
            
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    
                    if (res.status === 403) {
                        const waitTime = (i + 1) * 2000;
                        updateStatus(`Rate limited. Waiting ${waitTime/1000}s (Try ${i+1}/${retries})...`);
                        await new Promise(resolve => setTimeout(resolve, waitTime));
                        continue;
                    }

                    if (!res.ok) {
                        const errorData = await res.json().catch(() => ({}));
                        throw new Error(`HTTP ${res.status}: ${errorData.message || res.statusText}`);
                    }

                    const data = await res.json();
                    apiCache.set(path, data);
                    return data;
                } catch (err) {
                    if (i === retries - 1) throw err;
                }
            }
        }

        function formatName(name) {
            let formatted = name.replace(/\.[^/.]+$/, "");
            if (/^\d+(_\d+)+$/.test(formatted)) {
                return "Version " + formatted.replace(/_/g, ".");
            }
            return formatted.replace(/[-_]/g, " ");
        }

        async function processDirectory(dirPath, categoryObj) {
            updateStatus(`Scanning: ${dirPath.split('/').pop()}...`);
            const items = await apiFetch(dirPath);
            const files = items.filter(i => i.type === 'file' && ALLOWED_EXTENSIONS.some(ext => i.name.toLowerCase().endsWith(ext)));
            const icon = items.find(i => i.name.toLowerCase() === 'pack_icon.png');
            const banner = items.find(i => i.name.toLowerCase() === 'pack_banner.png');
            const subDirs = items.filter(i => i.type === 'dir' && !i.name.startsWith('.'));

            if (files.length > 0) {
                categoryObj.clients.push({
                    name: dirPath.split('/').pop(),
                    displayName: formatName(dirPath.split('/').pop()),
                    files: files,
                    iconUrl: icon ? icon.download_url : null,
                    bannerUrl: banner ? banner.download_url : null
                });
            }

            for (const sub of subDirs) {
                await processDirectory(sub.path, categoryObj);
            }
        }

        async function init() {
            libraryTree = [];
            apiCache.clear();
            updateStatus("Connecting to repository...");
            
            try {
                let startPoint = 'ClientLibrary/ClientLibrary';
                let rootDirs;
                
                try {
                    rootDirs = await apiFetch(startPoint);
                } catch (e) {
                    updateStatus(`Path ${startPoint} failed, trying fallback...`);
                    rootDirs = await apiFetch('ClientLibrary');
                }

                const categories = rootDirs.filter(f => f.type === 'dir' && !f.name.startsWith('.'));

                for (const cat of categories) {
                    const categoryObj = {
                        name: cat.name,
                        displayName: formatName(cat.name),
                        clients: []
                    };

                    await processDirectory(cat.path, categoryObj);

                    if (categoryObj.clients.length > 0) {
                        libraryTree.push(categoryObj);
                    }
                }

                if (libraryTree.length === 0) {
                    updateStatus("No valid client folders found.", true);
                    return;
                }

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                renderTabs();
                switchCategory(libraryTree[0].name);

            } catch (err) {
                updateStatus(`Fetch Error: ${err.message}\nTry again in a few minutes.`, true);
            }
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = libraryTree.map(cat => `
                <button onclick="switchCategory('${cat.name}')" id="tab-${cat.name}" 
                        class="pb-3 text-sm font-medium text-[#808080] hover:text-[#cccccf] transition-colors uppercase tracking-widest">
                    ${cat.displayName}
                </button>
            `).join('');
        }

        function switchCategory(name) {
            currentCategory = libraryTree.find(c => c.name === name);
            document.querySelectorAll('#category-tabs button').forEach(btn => btn.classList.remove('tab-active', 'text-white'));
            const activeTab = document.getElementById(`tab-${name}`);
            if (activeTab) activeTab.classList.add('tab-active', 'text-white');
            renderClients();
        }

        function renderClients(query = '') {
            const container = document.getElementById('client-container');
            const filteredClients = currentCategory.clients.filter(c => 
                c.displayName.toLowerCase().includes(query.toLowerCase()) ||
                c.files.some(f => f.name.toLowerCase().includes(query.toLowerCase()))
            );

            if (filteredClients.length === 0) {
                container.innerHTML = `<p class="text-center py-20 text-[#808080]">No results found.</p>`;
                return;
            }

            container.innerHTML = filteredClients.map(client => `
                <div class="space-y-4 animate-in fade-in duration-500">
                    <div class="flex items-center space-x-4">
                        ${client.iconUrl ? `<img src="${client.iconUrl}" class="w-12 h-12 rounded-lg object-cover shadow-lg border border-[#808080]/30">` : 
                          `<div class="w-12 h-12 bg-[#39393e] rounded-lg border border-[#808080]/30 flex items-center justify-center font-bold text-[#347ccb]">?</div>`}
                        <h2 class="text-2xl font-bold text-white">${client.displayName}</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${client.files.map(file => `
                            <div class="glass-card rounded-xl p-5 flex items-center justify-between">
                                ${client.bannerUrl ? `<img src="${client.bannerUrl}" class="banner-bg">` : ''}
                                <div class="card-content flex flex-col min-w-0">
                                    <span class="text-sm font-bold text-white truncate">${formatName(file.name)}</span>
                                    <span class="text-[10px] text-[#808080] font-mono mt-1">${file.name}</span>
                                </div>
                                <div class="card-content flex items-center ml-4">
                                    <a href="${file.download_url}" download="${file.name}"
                                       class="btn-primary text-white text-[11px] font-black py-2 px-5 rounded-md transition-all active:scale-95 uppercase tracking-tighter">
                                        Download
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderClients(e.target.value);
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
