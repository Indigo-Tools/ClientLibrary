name: Generate Library Index & Deploy

on:
  push:
    paths:
      - 'ClientLibrary/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate paths.json with metadata
        run: |
          echo "Generating comprehensive library index with metadata..."

          python3 - <<'PYEOF'
          import os, json, stat

          library_dir = "ClientLibrary"
          valid_exts = {".zip", ".dll", ".so", ".apk", ".mcpack", ".mcaddon"}
          image_exts = {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          tag_names = {"working", "legacy", "trash"}

          entries = []
          for root, dirs, files in os.walk(library_dir):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  rel = fpath.replace("\\", "/")
                  parts = rel.split("/")
                  if len(parts) < 3:
                      continue
                  low = fname.lower()
                  entry = {"path": rel}

                  if low == "pack_icon.png" or low == "pack_banner.png":
                      entries.append(entry)
                  elif low in ("description.txt", "description.md"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="replace") as f:
                              entry["content"] = f.read()
                      except:
                          entry["content"] = ""
                      entries.append(entry)
                  elif low in ("author.json", "creator.json"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="replace") as f:
                              entry["content"] = json.loads(f.read())
                      except:
                          entry["content"] = {}
                      entries.append(entry)
                  elif low in tag_names:
                      entries.append(entry)
                  elif any(low.endswith(e) for e in valid_exts):
                      try:
                          entry["size"] = os.path.getsize(fpath)
                      except:
                          pass
                      entries.append(entry)
                  elif any(low.endswith(e) for e in image_exts):
                      entries.append(entry)

          with open("paths.json", "w") as f:
              json.dump(entries, f, separators=(",", ":"))

          print(f"Generated paths.json with {len(entries)} entries")
          PYEOF

      - name: Commit and Push updated index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paths.json
          git commit -m "chore: update comprehensive library index [skip ci]" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4