name: Generate Library Index & Deploy

on:
  push:
    paths:
      - 'ClientLibrary/**'
      - '**.html'
      - '**.css'
      - '**.js'
      - 'manifest.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch LFS file sizes from pointers
        run: |
          git lfs install --local
          git lfs ls-files --size 2>/dev/null | awk '{
            size=$NF; gsub(/[^0-9]/, "", size)
            $NF=""; sub(/ \* /, "", $0); sub(/ - /, "", $0); sub(/^ /, "", $0); sub(/ $/, "", $0)
            print $0 "\t" size
          }' > lfs_sizes.tsv || touch lfs_sizes.tsv
          echo "LFS size entries: $(wc -l < lfs_sizes.tsv)"

      - name: Generate paths.json with metadata
        run: |
          echo "Generating comprehensive library index with metadata..."

          python3 - <<'PYEOF'
          import os, json

          library_dir = "ClientLibrary"
          valid_exts = {".zip", ".dll", ".so", ".apk", ".mcpack", ".mcaddon"}
          image_exts = {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          video_exts  = {".mp4", ".webm", ".mov", ".m4v", ".ogv"}

          def is_tag(name):
              return "." not in name and name.lower() not in ("readme", "license")

          # Load LFS sizes from the TSV generated in the previous step
          lfs_sizes = {}
          try:
              with open("lfs_sizes.tsv") as f:
                  for line in f:
                      parts = line.strip().split("\t")
                      if len(parts) == 2:
                          path_key = parts[0].replace("\\", "/")
                          try:
                              lfs_sizes[path_key] = int(parts[1])
                          except ValueError:
                              pass
              print(f"Loaded {len(lfs_sizes)} LFS size entries")
          except FileNotFoundError:
              print("No lfs_sizes.tsv found, sizes will be 0 for LFS files")

          entries = []
          for root, dirs, files in os.walk(library_dir):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  rel   = fpath.replace("\\", "/")
                  parts = rel.split("/")
                  if len(parts) < 3:
                      continue
                  low   = fname.lower()
                  entry = {"path": rel}

                  if low in ("pack_icon.png", "pack_banner.png"):
                      entries.append(entry)

                  elif low in ("description.txt", "description.md"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="replace") as f:
                              entry["content"] = f.read()
                      except Exception:
                          entry["content"] = ""
                      entries.append(entry)

                  elif low in ("author.json", "creator.json"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="replace") as f:
                              entry["content"] = json.loads(f.read())
                      except Exception:
                          entry["content"] = {}
                      entries.append(entry)

                  elif is_tag(fname):
                      entries.append(entry)

                  elif any(low.endswith(e) for e in valid_exts):
                      # Try real file size first (non-LFS), fall back to LFS pointer size
                      real_size = os.path.getsize(fpath)
                      if real_size <= 140:
                          # Almost certainly an LFS pointer stub (pointers are ~130 bytes)
                          entry["size"] = lfs_sizes.get(rel, 0)
                      else:
                          entry["size"] = real_size
                      entries.append(entry)

                  elif any(low.endswith(e) for e in image_exts):
                      entries.append(entry)

                  elif any(low.endswith(e) for e in video_exts):
                      entries.append(entry)

          with open("paths.json", "w") as f:
              json.dump(entries, f, separators=(",", ":"))

          print(f"Generated paths.json with {len(entries)} entries")
          PYEOF

      - name: Commit and Push updated index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paths.json
          git commit -m "chore: update comprehensive library index [skip ci]" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html script.js styles.css translations.js manifest.json paths.json _site/
          [ -f BG.png ]   && cp BG.png   _site/ || true
          [ -f logo.png ] && cp logo.png _site/ || true
          [ -f CNAME ]    && cp CNAME    _site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4