name: Generate Library Index

on:
  push:
    paths:
      - 'ClientLibrary/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate paths.json with metadata
        run: |
          echo "Generating comprehensive library index with metadata..."

          python3 - <<'PYEOF'
          import os, json, stat

          library_dir = "ClientLibrary"
          valid_exts = {".zip", ".dll", ".so", ".apk", ".mcpack", ".mcaddon"}
          image_exts = {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          tag_names = {"working", "legacy", "trash"}

          entries = []
          for root, dirs, files in os.walk(library_dir):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  rel = fpath.replace("\\", "/")
                  parts = rel.split("/")
                  if len(parts) < 3:
                      continue
                  low = fname.lower()
                  entry = {"path": rel}

                  if low == "pack_icon.png" or low == "pack_banner.png":
                      entries.append(entry)
                  elif low in ("description.txt", "description.md"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="replace") as f:
                              entry["content"] = f.read()
                      except:
                          entry["content"] = ""
                      entries.append(entry)
                  elif low in ("author.json", "creator.json"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="replace") as f:
                              entry["content"] = json.loads(f.read())
                      except:
                          entry["content"] = {}
                      entries.append(entry)
                  elif low in tag_names:
                      entries.append(entry)
                  elif any(low.endswith(e) for e in valid_exts):
                      try:
                          entry["size"] = os.path.getsize(fpath)
                      except:
                          pass
                      entries.append(entry)
                  elif any(low.endswith(e) for e in image_exts):
                      entries.append(entry)

          with open("paths.json", "w") as f:
              json.dump(entries, f, separators=(",", ":"))

          print(f"Generated paths.json with {len(entries)} entries")
          dl_files = [e for e in entries if any(e["path"].lower().endswith(x) for x in valid_exts)]
          print(f"  Downloadable files: {len(dl_files)}")
          desc_files = [e for e in entries if "content" in e and ("description" in e["path"].lower())]
          print(f"  Descriptions (inlined): {len(desc_files)}")
          author_files = [e for e in entries if "content" in e and ("author" in e["path"].lower() or "creator" in e["path"].lower())]
          print(f"  Author files (inlined): {len(author_files)}")
          PYEOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paths.json
          git commit -m "chore: update comprehensive library index [skip ci]" || exit 0
          git push
