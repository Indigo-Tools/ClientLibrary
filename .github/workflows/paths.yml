name: Generate Library Index

on:
  push:
    paths:
      - 'ClientLibrary/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate paths.json
        run: |
          echo "Generating library index..."
          
          # Initialize an empty object
          echo "{}" > paths.json

          # Loop through Categories
          # Example: ClientLibrary/Windows/
          for cat_path in ClientLibrary/*/; do
              [ -d "$cat_path" ] || continue
              category=$(basename "$cat_path")
              
              # Add category to JSON
              jq --arg cat "$category" '.[$cat] = {}' paths.json > tmp.json && mv tmp.json paths.json

              # Loop through Clients
              # Example: ClientLibrary/Windows/IndigoV1/
              for client_path in "$cat_path"*/; do
                  [ -d "$client_path" ] || continue
                  client=$(basename "$client_path")

                  # Find assets and files
                  # Using find to get paths relative to repo root
                  files_json=$(find "$client_path" -maxdepth 1 -type f \( -name "*.zip" -o -name "*.dll" -o -name "*.so" -o -name "*.apk" -o -name "*.mcpack" -o -name "*.mcaddon" \) | jq -R . | jq -s .)
                  icon_path=$(find "$client_path" -maxdepth 1 -type f -iname "pack_icon.png" | head -n 1)
                  banner_path=$(find "$client_path" -maxdepth 1 -type f -iname "pack_banner.png" | head -n 1)

                  # Inject into the specific category and client key
                  jq --arg cat "$category" \
                     --arg cli "$client" \
                     --arg ico "$icon_path" \
                     --arg ban "$banner_path" \
                     --argjson f "$files_json" \
                     '.[$cat][$cli] = {"icon": $ico, "banner": $ban, "files": $f}' paths.json > tmp.json && mv tmp.json paths.json
              done
          done

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paths.json
          git commit -m "chore: update library index [skip ci]" || exit 0
          git push
