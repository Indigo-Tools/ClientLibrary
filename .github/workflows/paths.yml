async function init() {
            updateStatus("Fetching library manifest...");
            try {
                // Use cache busting to ensure we get the latest paths.json
                const response = await fetch(`${BASE_RAW_URL}/paths.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("paths.json not found on server.");
                
                const data = await response.json();
                
                // Construct tree with heavy null-checking
                libraryTree = Object.entries(data || {}).map(([catKey, clients]) => {
                    return {
                        name: catKey,
                        displayName: formatName(catKey),
                        clients: Object.entries(clients || {}).map(([clientKey, clientData]) => {
                            return {
                                name: clientKey,
                                displayName: formatName(clientKey),
                                iconUrl: clientData.icon ? `${BASE_RAW_URL}/${clientData.icon}` : null,
                                bannerUrl: clientData.banner ? `${BASE_RAW_URL}/${clientData.banner}` : null,
                                files: Array.isArray(clientData.files) ? clientData.files.map(filePath => ({
                                    name: filePath.split('/').pop(),
                                    download_url: `${BASE_RAW_URL}/${filePath}`
                                })) : []
                            };
                        })
                    };
                }).filter(cat => cat.clients.length > 0); // Only show categories with clients

                if (libraryTree.length === 0) {
                    updateStatus("Library is empty. Ensure files are inside ClientLibrary/Category/ClientName/ folder.", true);
                    return;
                }

                document.getElementById('status-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                renderTabs();
                switchCategory(libraryTree[0].name);

            } catch (err) {
                console.error(err);
                updateStatus(`Error: ${err.message}`, true);
            }
        }
